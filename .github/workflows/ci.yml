name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q --cov=src/administrative_orchestrator --cov-report=xml:coverage.xml
      - name: Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: sqlite+pysqlite:///./migration-test.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Compose config
        run: docker compose config --quiet
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dbos-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: PostgreSQL Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: DBOS restart integration
        env:
          ADMIN_RUN_DBOS_INTEGRATION: "1"
          ADMIN_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest -q tests/test_dbos_integration.py

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up -d --build
      - name: Onboarding HTTP E2E
        env:
          ADMIN_E2E_TIMEOUT_SECONDS: "120"
        run: python scripts/e2e_compose.py
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop full stack
        if: always()
        run: docker compose down -v --remove-orphans

  kernel-cutover-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Administrative Orchestrator
        uses: actions/checkout@v4
      - name: Checkout Agent Kernel main
        uses: actions/checkout@v4
        with:
          repository: xiongweilin/agent-kernel
          ref: main
          path: .integration/agent-kernel
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install both repositories
        run: |
          uv sync --extra dev
          uv pip install --python .venv/bin/python -e .integration/agent-kernel
      - name: Start Administrative sandbox and Agent Kernel
        env:
          ADMIN_SANDBOX_DATABASE_URL: sqlite+pysqlite:///./kernel-cutover-sandbox.db
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          PORTABLE_RUNTIME_RESPONSIBILITY_ADMISSION_PROFILE: administrative-public
          PORTABLE_RUNTIME_BOUNDED_DOMAIN_EFFECT_FACTORY: scripts.kernel_cutover_stack:build
        run: |
          rm -f kernel-cutover-sandbox.db
          uv run uvicorn administrative_orchestrator.sandbox:app --host 127.0.0.1 --port 8010 >sandbox.log 2>&1 &
          echo $! > sandbox.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8010/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8010/healthz >/dev/null
          uv run uvicorn portable_runtime.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel.log 2>&1 &
          echo $! > kernel.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null
      - name: Prove Admin to Kernel to sandbox physical cutover
        env:
          ADMIN_KERNEL_BASE_URL: http://127.0.0.1:8020
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
        run: uv run python scripts/kernel_cutover_e2e.py
      - name: Cross-repo service logs
        if: failure()
        run: |
          echo '--- sandbox.log ---'
          cat sandbox.log || true
          echo '--- kernel.log ---'
          cat kernel.log || true
      - name: Stop cross-repo services
        if: always()
        run: |
          test ! -f kernel.pid || kill "$(cat kernel.pid)" || true
          test ! -f sandbox.pid || kill "$(cat sandbox.pid)" || true
