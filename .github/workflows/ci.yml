name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Checkout promoted Agent Kernel baseline
        uses: actions/checkout@v4
        with:
          repository: xiongweilin/agent-kernel
          ref: 706cb3514c7edd030518f016a8f9b232b98f8166
          path: .integration/agent-kernel
      - name: Install
        run: |
          uv sync --extra dev
          uv pip install --python .venv/bin/python -e .integration/agent-kernel
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q --cov=src/administrative_orchestrator --cov-report=xml:coverage.xml
      - name: Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: sqlite+pysqlite:///./migration-test.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Compose config
        run: docker compose config --quiet
      - name: Production Compose config
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarQube Cloud Quality Gate diagnostics
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: >-
          curl -fsS -u "${SONAR_TOKEN}:"
          "https://sonarcloud.io/api/qualitygates/project_status?projectKey=metratio_administrative-orchestrator&pullRequest=${SONAR_PULL_REQUEST}"
          | python -m json.tool
      - name: SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dbos-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: PostgreSQL Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: DBOS restart integration
        env:
          ADMIN_RUN_DBOS_INTEGRATION: "1"
          ADMIN_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          timeout 180s uv run pytest -vv -s
          tests/test_dbos_integration.py
          tests/test_kernel_dbos_restart.py

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up -d --build
      - name: Onboarding HTTP E2E
        env:
          ADMIN_E2E_TIMEOUT_SECONDS: "120"
        run: python scripts/e2e_compose.py
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop full stack
        if: always()
        run: docker compose down -v --remove-orphans

  kernel-cutover-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Administrative Orchestrator
        uses: actions/checkout@v4
      - name: Checkout promoted Agent Kernel baseline
        uses: actions/checkout@v4
        with:
          repository: xiongweilin/agent-kernel
          ref: 706cb3514c7edd030518f016a8f9b232b98f8166
          path: .integration/agent-kernel
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install both repositories
        run: |
          uv sync --extra dev
          uv pip install --python .venv/bin/python -e .integration/agent-kernel
      - name: Kernel capability profile contracts
        run: uv run pytest -q tests/test_m7_kernel_capability_cutover.py
      - name: Start Administrative sandbox and Agent Kernel
        env:
          ADMIN_SANDBOX_DATABASE_URL: sqlite+pysqlite:///./kernel-cutover-sandbox.db
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          PORTABLE_RUNTIME_RESPONSIBILITY_ADMISSION_PROFILE: administrative-public-v3
          PORTABLE_RUNTIME_DATABASE_URL: sqlite+pysqlite:///./kernel-cutover-kernel.db
          PORTABLE_RUNTIME_ENABLE_EXECUTION_DRIVE: "true"
          PORTABLE_RUNTIME_ENABLE_RECOVERY_DRIVE: "true"
          PORTABLE_RUNTIME_ENABLE_ACTION_DRIVE: "true"
          PORTABLE_RUNTIME_ENABLE_RESPONSIBILITY_DRIVE: "true"
          PORTABLE_RUNTIME_ENABLE_KERNEL_DRIVE: "true"
          PORTABLE_RUNTIME_REALITY_BOUNDARY_ENABLED: "true"
          PORTABLE_RUNTIME_REALITY_BOUNDARY_ALLOW_SIMULATION: "true"
        run: |
          uv run uvicorn administrative_orchestrator.sandbox_api:app --host 127.0.0.1 --port 8010 > /tmp/admin-sandbox.log 2>&1 &
          echo $! > /tmp/admin-sandbox.pid
          (
            cd .integration/agent-kernel
            uv run uvicorn portable_runtime.http_api:app --host 127.0.0.1 --port 8001 > /tmp/kernel.log 2>&1 &
            echo $! > /tmp/kernel.pid
          )
          python scripts/wait_for_http.py http://127.0.0.1:8010/healthz 30
          python scripts/wait_for_http.py http://127.0.0.1:8001/healthz 30
      - name: Prove Admin to Kernel to sandbox physical cutover
        run: uv run pytest -q tests/test_kernel_cutover_cross_repo.py::test_admin_to_kernel_to_sandbox_physical_cutover
      - name: Prove lost completion ACK survives Admin and Kernel process restart
        run: uv run pytest -q tests/test_kernel_process_restart_recovery.py::test_lost_completion_ack_recovers_after_admin_and_kernel_restart
      - name: Prove pre-receipt crash resumes from durable Attempt after Kernel restart
        run: uv run pytest -q tests/test_kernel_pre_receipt_restart.py::test_pre_receipt_crash_resumes_from_durable_attempt_after_kernel_restart
      - name: Prove durable reconciliation identity survives fresh provider process
        run: uv run pytest -q tests/test_kernel_reconciliation_identity.py::test_durable_reconciliation_identity_survives_fresh_provider_process
      - name: Prove ambiguous provider result recovers across a fresh Kernel process exactly once
        run: uv run pytest -q tests/test_kernel_ambiguous_provider_restart.py::test_ambiguous_provider_result_recovers_exactly_once_across_fresh_kernel_process
      - name: Cross-repo service logs
        if: failure()
        run: |
          cat /tmp/admin-sandbox.log || true
          cat /tmp/kernel.log || true
      - name: Stop cross-repo services
        if: always()
        run: |
          if [ -f /tmp/admin-sandbox.pid ]; then kill "$(cat /tmp/admin-sandbox.pid)" || true; fi
          if [ -f /tmp/kernel.pid ]; then kill "$(cat /tmp/kernel.pid)" || true; fi
