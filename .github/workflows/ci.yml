name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec "actionlint-py==1.7.12.24" actionlint -color
      - name: zizmor
        run: pipx run "zizmor==1.30.1" --persona=regular .github/workflows
      - name: gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --exit-code 1

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: OSV-Scanner (uv.lock)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Checkout promoted Agent Kernel baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: xiongweilin/agent-kernel
          ref: 17acfba8338683bdb0f3d1c93aa671778603482a
          path: .integration/agent-kernel
      - name: Install
        run: |
          uv sync --extra dev
          uv pip install --python .venv/bin/python -e .integration/agent-kernel
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q --cov=src/administrative_orchestrator --cov-report=xml:coverage.xml
      - name: Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: sqlite+pysqlite:///./migration-test.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Compose config
        run: docker compose config --quiet
      - name: Production Compose config
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dbos-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: PostgreSQL Alembic migration smoke
        env:
          ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: DBOS restart integration
        env:
          ADMIN_RUN_DBOS_INTEGRATION: "1"
          ADMIN_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          timeout 180s uv run pytest -vv -s
          tests/test_dbos_integration.py
          tests/test_kernel_dbos_restart.py

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start full stack
        run: docker compose up -d --build
      - name: Onboarding HTTP E2E
        env:
          ADMIN_E2E_TIMEOUT_SECONDS: "120"
        run: python scripts/e2e_compose.py
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop full stack
        if: always()
        run: docker compose down -v --remove-orphans

  kernel-cutover-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Administrative Orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout promoted Agent Kernel baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: xiongweilin/agent-kernel
          ref: 17acfba8338683bdb0f3d1c93aa671778603482a
          path: .integration/agent-kernel
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install both repositories
        run: |
          uv sync --extra dev
          uv pip install --python .venv/bin/python -e .integration/agent-kernel
      - name: Kernel capability profile contracts
        run: uv run pytest -q tests/test_m7_kernel_capability_cutover.py
      - name: Start Administrative sandbox and Agent Kernel
        env:
          ADMIN_SANDBOX_DATABASE_URL: sqlite+pysqlite:///./kernel-cutover-sandbox.db
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          AGENT_KERNEL_RESPONSIBILITY_ADMISSION_PROFILE: administrative-public-v3
          AGENT_KERNEL_BOUNDED_DOMAIN_EFFECT_FACTORY: scripts.kernel_cutover_stack:build
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH: ./kernel-cutover-kernel.db
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_ONCE_PATH: ./kernel-pre-receipt-fault.marker
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_SUBJECT: employee:kernel-pre-receipt-crash
        run: |
          rm -f kernel-cutover-sandbox.db kernel-cutover-kernel.db kernel-cutover-kernel.db-wal kernel-cutover-kernel.db-shm kernel-pre-receipt-fault.marker
          uv run uvicorn administrative_orchestrator.sandbox:app --host 127.0.0.1 --port 8010 >sandbox.log 2>&1 &
          echo $! > sandbox.pid
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8010/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8010/healthz >/dev/null
          uv run uvicorn agent_kernel.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel.log 2>&1 &
          echo $! > kernel.pid
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null
      - name: Prove Admin to Kernel to sandbox physical cutover
        env:
          ADMIN_KERNEL_BASE_URL: http://127.0.0.1:8020
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
        run: uv run python scripts/kernel_cutover_e2e.py
      - name: Prove lost completion ACK survives Admin and Kernel process restart
        env:
          ADMIN_KERNEL_BASE_URL: http://127.0.0.1:8020
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          ADMIN_LOST_ACK_DB_PATH: ./kernel-lost-ack-admin.db
          ADMIN_LOST_ACK_RECEIPT_PATH: ./kernel-lost-ack-first-receipt.json
          AGENT_KERNEL_RESPONSIBILITY_ADMISSION_PROFILE: administrative-public-v3
          AGENT_KERNEL_BOUNDED_DOMAIN_EFFECT_FACTORY: scripts.kernel_cutover_stack:build
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH: ./kernel-cutover-kernel.db
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_ONCE_PATH: ./kernel-pre-receipt-fault.marker
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_SUBJECT: employee:kernel-pre-receipt-crash
        run: |
          rm -f kernel-lost-ack-admin.db kernel-lost-ack-first-receipt.json lost-ack-phase1.log kernel-restart.log
          set +e
          uv run python scripts/kernel_lost_ack_e2e.py phase1 >lost-ack-phase1.log 2>&1
          phase1_status=$?
          set -e
          if [ "$phase1_status" -ne 1 ]; then
            cat lost-ack-phase1.log
            echo "expected phase1 injected process failure, got exit $phase1_status"
            exit 1
          fi
          uv run python scripts/kernel_lost_ack_e2e.py verify

          old_kernel_pid="$(cat kernel.pid)"
          kill "$old_kernel_pid"
          for _ in {1..40}; do
            if ! kill -0 "$old_kernel_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$old_kernel_pid" 2>/dev/null; then
            echo "Kernel phase-1 process did not terminate"
            exit 1
          fi

          uv run uvicorn agent_kernel.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel-restart.log 2>&1 &
          new_kernel_pid=$!
          echo "$new_kernel_pid" > kernel.pid
          if [ "$new_kernel_pid" = "$old_kernel_pid" ]; then
            echo "Kernel restart reused the same process id unexpectedly"
            exit 1
          fi
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null

          uv run python scripts/kernel_lost_ack_e2e.py phase2
      - name: Prove pre-receipt crash resumes from durable Attempt after Kernel restart
        env:
          ADMIN_KERNEL_BASE_URL: http://127.0.0.1:8020
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          ADMIN_PRE_RECEIPT_DB_PATH: ./kernel-pre-receipt-admin.db
          AGENT_KERNEL_RESPONSIBILITY_ADMISSION_PROFILE: administrative-public-v3
          AGENT_KERNEL_BOUNDED_DOMAIN_EFFECT_FACTORY: scripts.kernel_cutover_stack:build
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH: ./kernel-cutover-kernel.db
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_ONCE_PATH: ./kernel-pre-receipt-fault.marker
          AGENT_KERNEL_ADMIN_E2E_PRE_RECEIPT_FAIL_SUBJECT: employee:kernel-pre-receipt-crash
        run: |
          rm -f kernel-pre-receipt-admin.db pre-receipt-phase1.log kernel-pre-receipt-restart.log
          test ! -f kernel-pre-receipt-fault.marker

          set +e
          uv run python scripts/kernel_pre_receipt_restart_e2e.py phase1 >pre-receipt-phase1.log 2>&1
          phase1_status=$?
          set -e
          if [ "$phase1_status" -ne 1 ]; then
            cat pre-receipt-phase1.log
            echo "expected pre-receipt injected failure, got exit $phase1_status"
            exit 1
          fi
          uv run python scripts/kernel_pre_receipt_restart_e2e.py verify

          old_kernel_pid="$(cat kernel.pid)"
          kill "$old_kernel_pid"
          for _ in {1..40}; do
            if ! kill -0 "$old_kernel_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$old_kernel_pid" 2>/dev/null; then
            echo "pre-receipt Kernel process did not terminate"
            exit 1
          fi

          uv run uvicorn agent_kernel.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel-pre-receipt-restart.log 2>&1 &
          new_kernel_pid=$!
          echo "$new_kernel_pid" > kernel.pid
          if [ "$new_kernel_pid" = "$old_kernel_pid" ]; then
            echo "pre-receipt Kernel restart reused the same process id unexpectedly"
            exit 1
          fi
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null

          uv run python scripts/kernel_pre_receipt_restart_e2e.py phase2
      - name: Prove durable reconciliation identity survives fresh provider process
        env:
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH: ./kernel-cutover-kernel.db
        run: uv run python scripts/kernel_reconciliation_identity_e2e.py
      - name: Prove ambiguous provider result recovers across a fresh Kernel process exactly once
        env:
          ADMIN_KERNEL_BASE_URL: http://127.0.0.1:8020
          ADMIN_SANDBOX_BASE_URL: http://127.0.0.1:8010
          ADMIN_AMBIGUOUS_RECOVERY_DB_PATH: ./kernel-ambiguous-admin.db
          AGENT_KERNEL_ADMIN_E2E_RESULT_COMMIT_FAIL_ONCE_PATH: ./kernel-ambiguous-result.marker
        run: |
          old_kernel_pid="$(cat kernel.pid)"
          kill "$old_kernel_pid"
          for _ in {1..40}; do
            if ! kill -0 "$old_kernel_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$old_kernel_pid" 2>/dev/null; then
            echo "Kernel process did not terminate before ambiguous recovery proof"
            exit 1
          fi

          rm -f kernel-ambiguous-admin.db kernel-ambiguous-kernel.db kernel-ambiguous-kernel.db-wal kernel-ambiguous-kernel.db-shm kernel-ambiguous-result.marker kernel-ambiguous-fault.log kernel-ambiguous-restart.log
          AGENT_KERNEL_RESPONSIBILITY_ADMISSION_PROFILE=administrative-public-v3 \
          AGENT_KERNEL_BOUNDED_DOMAIN_EFFECT_FACTORY=scripts.kernel_cutover_stack:build \
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH=./kernel-ambiguous-kernel.db \
          AGENT_KERNEL_ADMIN_E2E_RESULT_COMMIT_FAIL_ONCE_PATH=./kernel-ambiguous-result.marker \
          uv run uvicorn agent_kernel.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel-ambiguous-fault.log 2>&1 &
          fault_kernel_pid=$!
          echo "$fault_kernel_pid" > kernel.pid
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null

          uv run python scripts/kernel_ambiguous_recovery_e2e.py phase1

          kill "$fault_kernel_pid"
          for _ in {1..40}; do
            if ! kill -0 "$fault_kernel_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$fault_kernel_pid" 2>/dev/null; then
            echo "faulting Kernel process did not terminate"
            exit 1
          fi

          AGENT_KERNEL_RESPONSIBILITY_ADMISSION_PROFILE=administrative-public-v3 \
          AGENT_KERNEL_BOUNDED_DOMAIN_EFFECT_FACTORY=scripts.kernel_cutover_stack:build \
          AGENT_KERNEL_ADMIN_E2E_STATE_PATH=./kernel-ambiguous-kernel.db \
          uv run uvicorn agent_kernel.public_contracts.http:create_configured_public_app --factory --host 127.0.0.1 --port 8020 >kernel-ambiguous-restart.log 2>&1 &
          recovered_kernel_pid=$!
          echo "$recovered_kernel_pid" > kernel.pid
          if [ "$recovered_kernel_pid" = "$fault_kernel_pid" ]; then
            echo "ambiguous recovery restart reused the same process id unexpectedly"
            exit 1
          fi
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8020/v1/contracts >/dev/null

          uv run python scripts/kernel_ambiguous_recovery_e2e.py phase2
      - name: Cross-repo service logs
        if: failure()
        run: |
          echo '--- sandbox.log ---'
          cat sandbox.log || true
          echo '--- kernel.log ---'
          cat kernel.log || true
          echo '--- kernel-restart.log ---'
          cat kernel-restart.log || true
          echo '--- kernel-pre-receipt-restart.log ---'
          cat kernel-pre-receipt-restart.log || true
          echo '--- kernel-ambiguous-fault.log ---'
          cat kernel-ambiguous-fault.log || true
          echo '--- kernel-ambiguous-restart.log ---'
          cat kernel-ambiguous-restart.log || true
          echo '--- lost-ack-phase1.log ---'
          cat lost-ack-phase1.log || true
          echo '--- pre-receipt-phase1.log ---'
          cat pre-receipt-phase1.log || true
      - name: Stop cross-repo services
        if: always()
        run: |
          test ! -f kernel.pid || kill "$(cat kernel.pid)" || true
          test ! -f sandbox.pid || kill "$(cat sandbox.pid)" || true
