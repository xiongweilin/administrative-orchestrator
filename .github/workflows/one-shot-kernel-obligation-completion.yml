name: One-shot Kernel obligation completion

on:
  push:
    branches:
      - codex/kernel-obligation-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Hydrate effect lineage from canonical obligation link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/administrative_orchestrator/execution_repository.py')
          text = path.read_text()
          text = text.replace(
              'from sqlalchemy import select\n',
              'from sqlalchemy import select\nfrom sqlalchemy.orm import Session\n',
              1,
          )
          text = text.replace(
              'from .persistence import (\n',
              'from .obligations import EffectObligationLinkRow\nfrom .persistence import (\n',
              1,
          )
          text = text.replace(
              'restored = self._effect_from_row(row)\n                if self._effect_identity(restored)',
              'restored = self._effect_from_row(\n                    row, self._effect_lineage(db, row.effect_id)\n                )\n                if self._effect_identity(restored)',
              1,
          )
          text = text.replace(
              'return None if row is None else self._effect_from_row(row)\n\n    def list_effects',
              'return (\n                None\n                if row is None\n                else self._effect_from_row(row, self._effect_lineage(db, row.effect_id))\n            )\n\n    def list_effects',
              1,
          )
          text = text.replace(
              'return [self._effect_from_row(row) for row in rows]\n\n    def set_effect_status',
              'return [\n                self._effect_from_row(row, self._effect_lineage(db, row.effect_id))\n                for row in rows\n            ]\n\n    def set_effect_status',
              1,
          )
          text = text.replace(
              'return self._effect_from_row(row)\n            row.status = status.value',
              'return self._effect_from_row(row, self._effect_lineage(db, row.effect_id))\n            row.status = status.value',
              1,
          )
          text = text.replace(
              'db.flush()\n            return self._effect_from_row(row)\n\n    def put_realization',
              'db.flush()\n            return self._effect_from_row(\n                row, self._effect_lineage(db, row.effect_id)\n            )\n\n    def put_realization',
              1,
          )
          marker = '    @staticmethod\n    def _effect_from_row(row: EffectRow) -> EffectRecord:\n'
          replacement = '''    @staticmethod\n    def _effect_lineage(\n        db: Session, effect_id: UUID\n    ) -> EffectObligationLinkRow | None:\n        return db.get(EffectObligationLinkRow, effect_id)\n\n    @staticmethod\n    def _effect_from_row(\n        row: EffectRow,\n        lineage: EffectObligationLinkRow | None = None,\n    ) -> EffectRecord:\n'''
          if marker not in text:
              raise SystemExit('effect mapper marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '"authorization_id": row.authorization_id,\n                "target_system": row.target_system,',
              '"authorization_id": row.authorization_id,\n                "obligation_id": (\n                    lineage.obligation_id if lineage is not None else None\n                ),\n                "governance_basis_id": (\n                    lineage.governance_basis_id if lineage is not None else None\n                ),\n                "target_system": row.target_system,',
              1,
          )
          path.write_text(text)
          PY
      - run: uv sync --extra dev
      - name: Focused completion conformance
        run: uv run pytest -q tests/test_kernel_obligation_completion.py tests/test_kernel_physical_cutover.py
      - name: Lint patch
        run: uv run ruff check src/administrative_orchestrator/execution_repository.py tests/test_kernel_obligation_completion.py
      - name: Commit durable lineage fix
        run: |
          git rm .github/workflows/one-shot-kernel-obligation-completion.yml
          git add src/administrative_orchestrator/execution_repository.py tests/test_kernel_obligation_completion.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Restore obligation lineage on durable effect reload"
          git push origin HEAD:${{ github.ref_name }}
