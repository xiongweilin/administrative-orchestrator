name: One-shot Kernel obligation completion

on:
  push:
    branches:
      - codex/kernel-obligation-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Focused completion conformance
        run: uv run pytest -q tests/test_kernel_obligation_completion.py
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-kernel-obligation-completion.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove one-shot Kernel obligation completion check"
          git push origin HEAD:${{ github.ref_name }}
