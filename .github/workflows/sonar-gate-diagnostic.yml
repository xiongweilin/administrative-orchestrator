name: Sonar Gate Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Sonar pull-request quality gate and file coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gate_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=metratio_administrative-orchestrator&pullRequest=${SONAR_PULL_REQUEST}"
          measures_url="https://sonarcloud.io/api/measures/component_tree?component=metratio_administrative-orchestrator&pullRequest=${SONAR_PULL_REQUEST}&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines&qualifiers=FIL&ps=500"
          curl -fsS -u "${SONAR_TOKEN}:" "$gate_url" | python -m json.tool
          curl -fsS -u "${SONAR_TOKEN}:" "$measures_url" | python -m json.tool
