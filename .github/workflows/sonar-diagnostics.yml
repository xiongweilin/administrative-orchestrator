name: Sonar Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Coverage
        run: uv run pytest -q --cov=src/administrative_orchestrator --cov-report=xml:coverage.xml
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Print Quality Gate conditions
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: metratio_administrative-orchestrator
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' .scannerwork/report-task.txt)"
          if [ -z "$ce_task_url" ]; then
            echo "ceTaskUrl missing from report-task.txt"
            exit 1
          fi

          for _ in {1..60}; do
            curl --fail --silent --user "$SONAR_TOKEN:" "$ce_task_url" > sonar-ce-task.json
            status="$(python - <<'PY'
          import json
          print(json.load(open('sonar-ce-task.json'))['task']['status'])
          PY
          )"
            case "$status" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                cat sonar-ce-task.json
                exit 1
                ;;
            esac
            sleep 2
          done

          analysis_id="$(python - <<'PY'
          import json
          payload = json.load(open('sonar-ce-task.json'))
          print(payload['task'].get('analysisId', ''))
          PY
          )"
          if [ -z "$analysis_id" ]; then
            cat sonar-ce-task.json
            echo "analysisId missing after Sonar processing"
            exit 1
          fi

          curl --fail --silent --user "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$analysis_id" \
            > sonar-quality-gate.json
          python - <<'PY'
          import json
          payload = json.load(open('sonar-quality-gate.json'))['projectStatus']
          print('qualityGateStatus=' + payload['status'])
          for condition in payload.get('conditions', []):
              print(
                  'condition '
                  f"metric={condition.get('metricKey')} "
                  f"status={condition.get('status')} "
                  f"actual={condition.get('actualValue')} "
                  f"operator={condition.get('comparator')} "
                  f"threshold={condition.get('errorThreshold')}"
              )
          PY

          curl --fail --silent --user "$SONAR_TOKEN:" --get \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "pullRequest=$SONAR_PULL_REQUEST" \
            --data-urlencode "resolved=false" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "ps=100" \
            "https://sonarcloud.io/api/issues/search" > sonar-vulnerabilities.json
          python - <<'PY'
          import json
          payload = json.load(open('sonar-vulnerabilities.json'))
          print(f"vulnerabilities={payload.get('total', 0)}")
          for issue in payload.get('issues', []):
              print(
                  'vulnerability '
                  f"rule={issue.get('rule')} severity={issue.get('severity')} "
                  f"component={issue.get('component')} line={issue.get('line')} "
                  f"message={issue.get('message')}"
              )
          PY

          curl --fail --silent --user "$SONAR_TOKEN:" --get \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "pullRequest=$SONAR_PULL_REQUEST" \
            --data-urlencode "metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/measures/component_tree" > sonar-new-coverage.json
          python - <<'PY'
          import json

          def value_of(measure):
              if measure.get('value') is not None:
                  return measure['value']
              periods = measure.get('periods') or []
              if periods:
                  return periods[0].get('value')
              return None

          payload = json.load(open('sonar-new-coverage.json'))
          rows = []
          for component in payload.get('components', []):
              measures = {item['metric']: value_of(item) for item in component.get('measures', [])}
              total = float(measures.get('new_lines_to_cover') or 0)
              if total <= 0:
                  continue
              uncovered = float(measures.get('new_uncovered_lines') or 0)
              coverage = float(measures.get('new_coverage') or 0)
              rows.append((coverage, -total, component.get('path'), int(total), int(uncovered)))
          for coverage, _, path, total, uncovered in sorted(rows):
              print(
                  f"newCoverage path={path} coverage={coverage:.1f} "
                  f"lines={total} uncovered={uncovered}"
              )
          PY
